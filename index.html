<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff1f6">
<title>for anis ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');

*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:18px;
 font-family:'DM Sans',sans-serif;color:#75465b;
 background:linear-gradient(145deg,#fff9fc,#ffe5ef);
 display:flex;align-items:center;justify-content:center;
}
button,input{font:inherit}
button{cursor:pointer;border:0;transition:.2s}
button:hover{filter:brightness(.96)}
button:active{transform:scale(.97)}
.screen{display:none;width:100%;max-width:500px}
.screen.active{display:block;animation:show .3s ease}
.card{
 background:#fffafd;padding:28px 20px;border-radius:25px;
 box-shadow:0 12px 40px #a85e781b;text-align:center;
 border:1px solid white;
}
h1,h2{font-family:'Playfair Display',serif;font-weight:500}
h1{font-size:40px;margin:12px 0}
h2{font-size:29px;margin:12px 0}
p{font-size:14px;line-height:1.8}
.small{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.65}
.emoji{font-size:43px;margin:10px}
.primary,.secondary{padding:12px 20px;border-radius:30px;margin:5px}
.primary{background:#e99fba;color:white}
.secondary{background:#ffedf4;color:#75465b}
input[type=password]{width:100%;padding:14px;border:1px solid #e8bfd0;border-radius:13px;text-align:center;margin:12px 0;outline:none}
.message{min-height:24px;font-size:13px;margin:12px 0}
.gamebox{padding:15px;background:#fff0f6;border-radius:18px;margin:16px 0}
.arena{height:155px;position:relative;background:#fff9fc;border-radius:15px;overflow:hidden;margin:12px 0}
.target{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:38px}
.range{width:90%;accent-color:#df8eac}
.pinrow{font-size:24px;line-height:1.8;overflow-wrap:anywhere}
.bricks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:15px 0}
.brick{height:45px;border-radius:8px;background:#dc91af;color:white}
.brick.gone{visibility:hidden}
.tiles{display:grid;grid-template-columns:repeat(2,85px);justify-content:center;gap:8px;margin:18px}
.tile{height:70px;border-radius:12px;background:#e99fba;color:white;font-size:24px}
.tile.done{background:#9dbca4}
.slots{display:flex;justify-content:center;gap:8px;margin:18px 0}
.slot{width:47px;height:55px;border:2px solid #ecc4d5;border-radius:12px;background:white;font-size:23px}
.slot.selected{background:#ffdce9;border-color:#c16e91}
.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:260px;margin:15px auto}
.color{height:58px;border-radius:12px;color:white;font-size:21px}
.c0{background:#d7789e}.c1{background:#819bd0}.c2{background:#80b59a}.c3{background:#d4a15e}
.slideText{white-space:pre-line;text-align:left;line-height:1.9;font-size:14px;margin:22px 0}
.progress{height:5px;background:#f5dce6;border-radius:10px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#df8eac}
#musicBtn{display:none;position:fixed;top:10px;right:10px;background:white;color:#75465b;padding:10px 13px;border-radius:20px;border:1px solid #efd3df}
@keyframes show{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<audio id="music" loop>
 <source src="lagu.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" onclick="toggleMusic()">♫ play music</button>

<section class="screen active" id="passwordScreen">
 <div class="card">
  <div class="emoji">♡</div>
  <div class="small">a little surprise</div>
  <h1>hey, anis.</h1>
  <p>enter our special date dulu hehe.</p>
  <input type="password" id="password" placeholder="password">
  <button class="primary" onclick="checkPassword()">let me in ♡</button>
  <div class="message" id="passwordMsg"></div>
  <div class="small">hint: our special date</div>
 </div>
</section>

<section class="screen" id="gameScreen">
 <div class="card">
  <div class="small" id="gameCount">challenge 1 / 7</div>
  <div class="emoji" id="gameEmoji">🎯</div>
  <h2 id="gameTitle"></h2>
  <p id="gameDesc"></p>
  <div class="gamebox" id="gameArea"></div>
  <div class="message" id="gameMsg"></div>
  <div id="gameExtra"></div>
 </div>
</section>

<section class="screen" id="slideScreen">
 <div class="card">
  <div class="small">just for you</div>
  <div class="emoji" id="slideEmoji"></div>
  <div class="small" id="slideCount"></div>
  <h2 id="slideTitle"></h2>
  <div class="progress"><div id="bar"></div></div>
  <div class="slideText" id="slideText"></div>
  <button class="primary" id="nextBtn" onclick="nextSlide()">next →</button>
 </div>
</section>

<script>
"use strict";

const PASSWORD = "15/6/2026";

const slides = [
 {
  emoji:"♡",title:"hi, sayang.",
  text:`sooo, you made it haha.

i wanted to make something for you, just because. it's a simple thing, but i made it with you in mind.

anyway, hi anis. this little website is yours. enjoy it okay? ♡`
 },
 {
  emoji:"☁️",title:"a little reminder",
  text:`i know we both have our own things going on. sometimes we're busy, tired, or just don't know what to say.

it's okay if we can't talk all the time. i don't expect you to be available 24/7.

i just hope we still make time for each other whenever we can. even a small conversation means something to me.`
 },
 {
  emoji:"🫶🏻",title:"about me",
  text:`bb tau bb kadang-kadang overprotective sangat. sometimes i overthink and let my worries affect the way i treat you.

i'm sorry kalau bb pernah buat kau terasa or uncomfortable. that's not what i want.

i care about you, but i know caring doesn't mean i get to control everything. i'm still learning, and i'll try to do better.`
 },
 {
  emoji:"🤍",title:"i'm sorry, sayang",
  text:`i'm not saying sorry just to make things okay again. i really mean it.

i know my actions can affect your feelings too. kalau bb buat kau uncomfortable, i'm sorry. you deserve to feel trusted and respected.

i can't promise i'll never make mistakes, but i can take responsibility and learn from them.`
 },
 {
  emoji:"🌷",title:"about us",
  text:`i don't need us to be a perfect couple. we're both still learning, and misunderstandings can happen.

what matters to me is that we can be honest, talk things out, and listen even when it's hard.

i don't want us to ignore each other's feelings just because we're upset. let's try to understand each other instead of trying to win.`
 },
 {
  emoji:"☾",title:"please remember",
  text:`you don't have to be okay all the time. if something is bothering you, you can tell me when you're ready.

i'll try to listen without making everything about me. and if bb buat salah, please let bb know too.

i want us to feel safe being honest with each other. no need to pretend everything is fine when it isn't.`
 },
 {
  emoji:"♡",title:"that's all, anis.",
  text:`thank you for being part of my life.

i'm happy i get to know you, spend time with you, and make memories with you. i look forward to the little things we haven't done together yet.

i care about you, sayang. no big dramatic promises, just me trying to be better for myself and for us.

take care always, okay? smile sikit hehe.

— bb ♡`
 }
];

let level = 0;
let musicPlaying = false;
let hits = 0, target = 50;
let pins = 10, rolls = 0, baskets = 0;
let blocksLeft = 8, puzzleStep = 1;
let clawPos = 2, clawPrize = 0, clawTries = 3;
let sequence = [], sequenceStep = 0, sequenceReady = false;

const $ = id => document.getElementById(id);

function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}

$("password").addEventListener("keydown",e=>{
 if(e.key==="Enter") checkPassword();
});

function checkPassword(){
 if($("password").value.trim()===PASSWORD){
  level=0;
  startGame();
 }else{
  $("passwordMsg").textContent="wrong password hehe, try again 👀";
  $("password").value="";
 }
}

function setupGame(title,emoji,desc,html){
 $("gameCount").textContent="challenge "+(level+1)+" / 7";
 $("gameTitle").textContent=title;
 $("gameEmoji").textContent=emoji;
 $("gameDesc").textContent=desc;
 $("gameArea").innerHTML=html;
 $("gameMsg").textContent="complete the game to unlock your slide ♡";
 $("gameExtra").innerHTML="";
 showScreen("gameScreen");
}

function winGame(text){
 $("gameMsg").textContent=text;
 $("gameExtra").innerHTML='<button class="primary" onclick="openSlide()">unlock slide ♡</button>';
}

// 1. ARCHERY
function archery(){
 hits=0;
 target=rand(15,85);
 setupGame("archery time","🎯","aim at the target. hit it 3 times.",`
 <div class="arena">
  <div class="target" id="target" style="left:${target}%">🎯</div>
 </div>
 <p>hits: <b id="hits">0 / 3</b></p>
 <label>aim left or right</label>
 <input class="range" id="aim" type="range" min="0" max="100" value="50">
 <br><button class="primary" onclick="shootArrow()">shoot arrow ↗</button>`);
}
function shootArrow(){
 if(Math.abs(Number($("aim").value)-target)<=14){
  hits++;
  $("hits").textContent=hits+" / 3";
  if(hits>=3){winGame("bullseye! nice shot 🎯");return;}
  $("gameMsg").textContent="bullseye! one more ♡";
 }else{
  $("gameMsg").textContent="missed! adjust your aim and try again.";
 }
 target=rand(15,85);
 $("target").style.left=target+"%";
}

// 2. BOWLING
function bowling(){
 pins=10;rolls=0;
 setupGame("bowling time","🎳","knock down all 10 pins in 4 rolls.",`
 <div class="big">🎳</div>
 <div class="pinrow" id="pinDisplay">🎳 🎳 🎳 🎳 🎳<br>🎳 🎳 🎳 🎳 🎳</div>
 <p>pins left: <b id="pinsLeft">10</b> · rolls: <b id="rolls">0 / 4</b></p>
 <label>throw power</label>
 <input class="range" id="power" type="range" min="20" max="100" value="70">
 <br><button class="primary" onclick="rollBall()">bowl! 🎳</button>`);
}
function rollBall(){
 rolls++;
 const power=Number($("power").value);
 let knocked=power>=90?4:power>=65?3:1;
 pins=Math.max(0,pins-knocked);
 $("pinsLeft").textContent=pins;
 $("rolls").textContent=rolls+" / 4";
 $("pinDisplay").textContent=pins===0?"STRIKE! 🎉":"🎳 ".repeat(pins);
 if(pins===0){winGame("all pins down! bowling champion 🏆");return;}
 if(rolls>=4){
  $("gameMsg").textContent="not quite! try bowling again.";
  $("gameExtra").innerHTML='<button class="secondary" onclick="bowling()">retry ↻</button>';
 }else{
  $("gameMsg").textContent="you knocked down "+knocked+" pins!";
 }
}

// 3. BASKETBALL
function basketball(){
 baskets=0;target=rand(15,85);
 setupGame("basketball","🏀","aim for the hoop and score 3 baskets.",`
 <div class="arena"><div class="target" id="hoop" style="left:${target}%">🏀</div></div>
 <p>baskets: <b id="baskets">0 / 3</b></p>
 <label>aim left or right</label>
 <input class="range" id="basketAim" type="range" min="0" max="100" value="50">
 <br><button class="primary" onclick="shootBasket()">shoot! 🏀</button>`);
}
function shootBasket(){
 if(Math.abs(Number($("basketAim").value)-target)<=15){
  baskets++;
  $("baskets").textContent=baskets+" / 3";
  if(baskets>=3){winGame("three baskets! MVP bah 😎");return;}
  $("gameMsg").textContent="SCORE! one more 🏀";
 }else{
  $("gameMsg").textContent="missed! adjust your aim.";
 }
 target=rand(15,85);
 $("hoop").style.left=target+"%";
}

// 4. BRICK BREAKER
function brickBreaker(){
 blocksLeft=8;
 let html='<p>tap every block to break them all!</p><div class="bricks">';
 for(let i=0;i<8;i++){
  html+='<button class="brick" id="brick'+i+'" onclick="breakBrick('+i+')">✦</button>';
 }
 html+='</div><p>blocks left: <b id="blocksLeft">8</b></p><div class="big">⚪ ▰ ▰</div>';
 setupGame("brick breaker","🧱","clear all 8 blocks to continue.",html);
}
function breakBrick(i){
 const block=$("brick"+i);
 if(!block||block.classList.contains("gone"))return;
 block.classList.add("gone");
 blocksLeft--;
 $("blocksLeft").textContent=blocksLeft;
 if(blocksLeft===0)winGame("all blocks cleared! nice one 🧱");
}

// 5. PUZZLE
function puzzleGame(){
 puzzleStep=1;
 const nums=[1,2,3,4].sort(()=>Math.random()-.5);
 const html='<p>tap the numbers in order: 1, 2, 3, 4.</p><div class="tiles">'+
 nums.map(n=>'<button class="tile" id="tile'+n+'" onclick="tapTile('+n+')">'+n+'</button>').join("")+
 '</div><p>next number: <b id="puzzleStep">1</b></p>';
 setupGame("tiny puzzle","🧩","complete the puzzle in the correct order.",html);
}
function tapTile(n){
 const tile=$("tile"+n);
 if(tile.classList.contains("done"))return;
 if(n===puzzleStep){
  tile.classList.add("done");
  tile.textContent="✓";
  puzzleStep++;
  if(puzzleStep===5){winGame("puzzle solved! smart girl 🧩");return;}
  $("puzzleStep").textContent=puzzleStep;
  $("gameMsg").textContent="correct! keep going ♡";
 }else{
  $("gameMsg").textContent="wrong one hehe, follow the order!";
 }
}

// 6. CLAW MACHINE
function clawMachine(){
 clawPos=2;clawTries=3;clawPrize=rand(0,4);
 setupGame("claw machine","🕹️","find the hidden prize. you have 3 tries.",`
 <div class="slots">${[0,1,2,3,4].map(i=>
  '<button class="slot '+(i===2?'selected':'')+'" id="slot'+i+'" onclick="selectSlot('+i+')">'+(i===2?'🕹️':'?')+'</button>'
 ).join("")}</div>
 <p>tries left: <b id="tries">3</b></p>
 <button class="primary" onclick="grabPrize()">grab prize! 🎁</button>`);
}
function selectSlot(i){
 clawPos=i;
 for(let n=0;n<5;n++){
  $("slot"+n).classList.toggle("selected",n===i);
  $("slot"+n).textContent=n===i?"🕹️":"?";
 }
}
function grabPrize(){
 if(clawPos===clawPrize){
  $("slot"+clawPos).textContent="🎁";
  winGame("you got the prize! lucky girl 🎁");
  return;
 }
 clawTries--;
 $("tries").textContent=clawTries;
 if(clawTries<=0){
  $("gameMsg").textContent="the machine is tricky 😭 try again!";
  $("gameExtra").innerHTML='<button class="secondary" onclick="clawMachine()">retry machine ↻</button>';
 }else{
  $("gameMsg").textContent="not that one! try another slot.";
 }
}

// 7. MEMORY CHALLENGE
function finalChallenge(){
 sequence=Array.from({length:4},()=>rand(0,3));
 sequenceStep=0;
 sequenceReady=false;
 setupGame("final challenge","🏆","memorise the colour sequence, then repeat it.",`
 <p id="sequenceText">remember: ${sequence.map(colourEmoji).join(" ")}</p>
 <button class="secondary" onclick="hideSequence()">ready! hide the sequence</button>
 <div class="colors">
 ${[0,1,2,3].map(i=>'<button class="color c'+i+'" onclick="chooseColour('+i+')">'+colourEmoji(i)+'</button>').join("")}
 </div>
 <p>correct: <b id="seqProgress">0 / 4</b></p>`);
}
function hideSequence(){
 sequenceReady=true;
 $("sequenceText").textContent="now repeat the sequence!";
 $("gameMsg").textContent="tap the colours in the same order.";
}
function chooseColour(n){
 if(!sequenceReady){
  $("gameMsg").textContent="press the hide button first!";
  return;
 }
 if(n!==sequence[sequenceStep]){
  sequenceStep=0;
  $("seqProgress").textContent="0 / 4";
  $("gameMsg").textContent="not quite! try the sequence again.";
  return;
 }
 sequenceStep++;
 $("seqProgress").textContent=sequenceStep+" / 4";
 if(sequenceStep===4){
  winGame("you finished every challenge! 🎉");
 }
}
function colourEmoji(n){return ["💗","💙","💚","💛"][n];}

function rand(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}

function startGame(){
 if(level===0)archery();
 else if(level===1)bowling();
 else if(level===2)basketball();
 else if(level===3)brickBreaker();
 else if(level===4)puzzleGame();
 else if(level===5)clawMachine();
 else if(level===6)finalChallenge();
}

function openSlide(){
 const slide=slides[level];
 $("slideEmoji").textContent=slide.emoji;
 $("slideTitle").textContent=slide.title;
 $("slideText").textContent=slide.text;
 $("slideCount").textContent="slide "+(level+1)+" / "+slides.length;
 $("bar").style.width=((level+1)/slides.length*100)+"%";
 $("nextBtn").textContent=level===slides.length-1?"finish ♡":"next →";
 $("nextBtn").onclick=nextSlide;
 showScreen("slideScreen");

 $("musicBtn").style.display="block";
 const music=$("music");
 music.volume=.35;
 if(!musicPlaying){
  music.play().then(()=>{
   musicPlaying=true;
   updateMusicButton();
  }).catch(()=>{
   $("musicBtn").textContent="♫ tap to play";
  });
 }
}

function nextSlide(){
 if(level===slides.length-1){
  $("slideEmoji").textContent="♡";
  $("slideTitle").textContent="thank you, anis.";
  $("slideText").textContent="that's the end of the little surprise. hope it made you smile, even just a little. take care, sayang. — bb ♡";
  $("slideCount").textContent="the end";
  $("bar").style.width="100%";
  $("nextBtn").textContent="start again ↻";
  $("nextBtn").onclick=()=>{
   level=0;
   $("nextBtn").onclick=nextSlide;
   startGame();
  };
  return;
 }
 level++;
 startGame();
}

function toggleMusic(){
 const music=$("music");
 if(musicPlaying){
  music.pause();
  musicPlaying=false;
 }else{
  music.play().then(()=>{
   musicPlaying=true;
   updateMusicButton();
  }).catch(()=>{});
 }
 updateMusicButton();
}
function updateMusicButton(){
 $("musicBtn").textContent=musicPlaying?"♫ pause music":"♫ play music";
}
</script>
</body>
</html>
